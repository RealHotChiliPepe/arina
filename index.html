<style>
  :root {
    --pink: #f5c3d3;
    --lipstick: #d33c5c;
    --paper: #fffdf8;
    --cream: #f6eee2;
    --ink: #221a1c;
    --line: #b9cbe0;
    --stitch: #e27ba0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; overflow-x: clip; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "Alice", Georgia, serif;
    font-size: 19px;
    line-height: 1.5;
    padding: 26px 16px 60px;
    overflow-x: hidden;
    background-color: var(--pink);

  }
  main { max-width: 480px; margin: 0 auto; position: relative; }

  .hearts { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .hearts svg { width: 20px; height: 20px; }

  .strip {
    display: table; margin: 0 auto 14px; padding: 3px 10px 4px;
    background: var(--paper); font-family: "PT Mono", monospace; font-size: 13px;
    letter-spacing: .06em; transform: rotate(-1.5deg);
    box-shadow: 1px 2px 0 rgba(0,0,0,.12);
  }

  .ransom { text-align: center; margin: 0 0 22px; line-height: 1.25; font-weight: normal; }
  .word { display: inline-block; white-space: nowrap; margin: 0 6px 8px; }
  .word.long { white-space: normal; }
  .rl {
    display: inline-block; padding: 1px 5px 2px; margin: 0 1px;
    box-shadow: 1px 2px 0 rgba(0,0,0,.18);
  }

  .card {
    position: relative; margin: 0 0 22px; padding: 24px 20px 22px;
    background: var(--paper);
    box-shadow: 0 2px 0 rgba(0,0,0,.06), 0 10px 22px -12px rgba(120,30,60,.45);
  }
  .tape::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 96px; height: 26px;
    margin-left: -48px; transform: rotate(-3deg);
    background: rgba(246,236,214,.8);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .torn {
    clip-path: polygon(0 0, 100% 0, 100% 96%, 96% 99%, 91% 96%, 86% 100%, 80% 97%, 74% 100%, 68% 96%, 61% 99%, 55% 96%, 49% 100%, 43% 97%, 37% 100%, 31% 96%, 25% 99%, 19% 96%, 12% 100%, 6% 97%, 0 99%);
    padding-bottom: 34px;
  }
  .tilt-l { transform: rotate(-1.2deg); }
  .tilt-r { transform: rotate(1deg); }

  .note {
    font-family: "Caveat", cursive; font-weight: 500; font-size: 27px; line-height: 34px;
    padding: 30px 18px 24px 46px;
    background:
      linear-gradient(90deg, transparent 32px, #f19aa8 32px, #f19aa8 34px, transparent 34px),
      repeating-linear-gradient(var(--paper) 0 33px, var(--line) 33px 34px);
    background-position: 0 0, 0 22px;
  }
  .note p { margin: 0; }

  .dict {
    width: 80%; margin: -6px 0 24px auto; padding: 10px 14px;
    background: var(--cream); font-size: 14px; line-height: 1.4; transform: rotate(2deg);
    box-shadow: 1px 2px 0 rgba(0,0,0,.1);
  }
  .dict b { font-family: "Playfair Display", serif; font-size: 22px; }
  .dict i { color: #6d5d60; }

  .label { margin: 0 0 12px; }
  .riddle { font-size: 21px; margin: 0; }
  .cipher { text-align: center; margin: 18px 0 4px; line-height: 1.5; }
  .cipher .rl { min-width: 30px; text-align: center; }
  .alphabet {
    margin: 12px 0 0; text-align: center; font-family: "PT Mono", monospace;
    font-size: 13px; letter-spacing: .2em; color: #7a6468; word-break: break-all;
  }
  .spot {
    margin: 16px 0 0; padding-top: 12px; border-top: 2px dashed var(--stitch);
    font-family: "Caveat", cursive; font-size: 24px; line-height: 1.2;
  }

  .polaroid {
    background: #fff; padding: 10px 10px 4px; margin: 16px 0 4px;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.45); transform: rotate(-1.5deg);
  }
  .polaroid .map { position: relative; height: 280px; overflow: hidden; background: #eadfd6; }
  .map img { position: absolute; width: 256px; height: 256px; max-width: none; }
  .map .ring { position: absolute; left: 0; top: 0; }
  .map .osm { position: absolute; right: 0; bottom: 0; padding: 1px 5px; font: 10px system-ui, sans-serif; background: rgba(255,255,255,.8); }
  .polaroid figcaption {
    font-family: "Caveat", cursive; font-size: 24px; text-align: center; padding: 4px 0 2px;
  }
  .map-missing {
    margin: 16px 0 4px; padding: 16px; text-align: center; font-size: 15px;
    background: var(--cream); color: #7a6468;
  }

  .hintbox {
    background: #fde8ef; padding: 22px 20px;
    outline: 2px dashed var(--stitch); outline-offset: -9px;
  }
  .hint { display: none; }
  .hint.show { display: block; }
  .hint p { margin: 0; font-family: "Caveat", cursive; font-size: 25px; line-height: 1.25; }
  .hint.show ~ .hint.show { margin-top: 14px; }
  button.hint.show {
    width: 100%; padding: 12px 10px;
    font: 700 24px "Caveat", cursive; color: #fff; cursor: pointer;
    background: var(--lipstick); border: 0; border-radius: 40px;
    box-shadow: 0 3px 0 #9e2640; transform: rotate(-1deg);
  }
  button.hint.show:active { transform: rotate(-1deg) translateY(2px); box-shadow: 0 1px 0 #9e2640; }

  .task-input {
    width: 100%; margin-top: 14px; padding: 10px 12px;
    font: 500 26px "Caveat", cursive; color: var(--ink); background: #fff;
    border: 2px dashed var(--stitch); border-radius: 10px; outline: none;
  }
  .btn {
    display: block; width: 100%; margin-top: 12px; padding: 12px 10px;
    font: 700 24px "Caveat", cursive; color: #fff; cursor: pointer;
    background: var(--lipstick); border: 0; border-radius: 40px;
    box-shadow: 0 3px 0 #9e2640; transform: rotate(-1deg);
  }
  .btn.ghost { background: transparent; color: var(--lipstick); box-shadow: none; border: 2px solid var(--lipstick); }
  .task-msg { margin: 10px 0 0; font-family: "Caveat", cursive; font-size: 23px; min-height: 1em; }
  .locked-note { text-align: center; font-family: "Caveat", cursive; font-size: 23px; color: #7c2940; margin: 0 0 22px; }
  .hidden { display: none; }

  .call {
    text-align: center; margin-top: 26px;
    font-family: "Caveat", cursive; font-size: 24px; color: #7c2940;
  }

  .kiss { position: absolute; pointer-events: none; z-index: 3; mix-blend-mode: multiply; opacity: .8; }
  .kiss.tr { top: -34px; right: -22px; }
  .kiss.bl { bottom: -30px; left: -20px; }
  .kiss.tl { top: -8px; left: -30px; }

  .draft {
    background: #fff; color: #9e1b35; border: 2px solid #9e1b35;
    padding: 10px 12px; font: 14px/1.4 system-ui, sans-serif; margin-bottom: 18px;
  }
</style>
</head>

const ORDER = ["a4f610", "863e0c", "75995a", "651688", "43c6fb", "197594", "5f95e4", "33af55"];   // порядок этапов
/* ==================================================================== */
</script>


<script>
const ALPHABET = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Детерминированный генератор: одна и та же страница всегда выглядит одинаково
function rng(seed) {
  let h = 2166136261;
  for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13; return ((h >>> 0) % 10000) / 10000; };
}

const FONTS = [
  ["Playfair Display", 900, "normal"], ["Oswald", 600, "normal"], ["Rubik Mono One", 400, "normal"],
  ["Lobster", 400, "normal"], ["Russo One", 400, "normal"], ["Alice", 400, "normal"],
  ["Playfair Display", 700, "italic"], ["PT Mono", 400, "normal"]
];
const SWATCH = [
  ["#fffdf8", "#221a1c"], ["#221a1c", "#fffdf8"], ["#f4a7c0", "#221a1c"], ["#c9b6e4", "#221a1c"],
  ["#efe3cf", "#221a1c"], ["#fffdf8", "#d33c5c"], ["#e8e6e1", "#4a3a8c"], ["#d33c5c", "#fffdf8"]
];

function ransom(text, seed, size) {
  const r = rng(seed);
  return text.split(" ").map(word => {
    const letters = [...word].map(ch => {
      const f = FONTS[Math.floor(r() * FONTS.length)];
      const s = SWATCH[Math.floor(r() * SWATCH.length)];
      const rot = (r() * 12 - 6).toFixed(1);
      const fs = Math.round(size * (0.85 + r() * 0.35));
      const up = f[0] === "Lobster" ? ch : (r() > 0.45 ? ch.toUpperCase() : ch.toLowerCase());
      return `<span class="rl" style="font-family:'${f[0]}',serif;font-weight:${f[1]};font-style:${f[2]};background:${s[0]};color:${s[1]};transform:rotate(${rot}deg);font-size:${fs}px">${esc(up)}</span>`;
    }).join("");
    return `<span class="word${[...word].length > 9 ? " long" : ""}">${letters}</span>`;
  }).join(" ");
}

function hearts(idx) {
  return ORDER.map((_, i) =>
    `<svg viewBox="0 0 24 24"><use href="#heart" fill="${i <= idx ? "#d33c5c" : "#fbe3ec"}"/></svg>`).join("");
}

function kiss(seed, cls) {
  const r = rng(seed);
  const rot = Math.round(r() * 50 - 25), w = 78 + Math.round(r() * 22);
  return `<svg class="kiss ${cls}" style="width:${w}px;height:${Math.round(w * .6)}px;transform:rotate(${rot}deg)" viewBox="0 0 120 72"><use href="#lips"/></svg>`;
}

const norm = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]/g, "");

function usesMap(st) { return st.map || (st.hints || []).some(h => h.map); }
function zoneReady(z) { return z && typeof z.lat === "number" && typeof z.lon === "number"; }
function isDraft() {
  return ORDER.some(k => {
    const st = STAGES[k];
    const texts = [st.title, st.note, st.riddle, st.spot, st.task || "", ...(st.answers || []), ...(st.hints || []).map(h => h.text)];
    return texts.some(t => String(t).includes("[")) || (usesMap(st) && !zoneReady(st.zone));
  });
}

// Центр зоны сдвинут: тайник внутри круга, но не в центре
function shiftedCenter(key, z) {
  const r = rng(key + "z");
  const angle = r() * 2 * Math.PI;
  const dist = z.r * (0.35 + r() * 0.2);
  const dLat = (dist * Math.cos(angle)) / 111320;
  const dLon = (dist * Math.sin(angle)) / (111320 * Math.cos(z.lat * Math.PI / 180));
  return [z.lat + dLat, z.lon + dLon];
}

function mapHtml(id, z) {
  return zoneReady(z)
    ? `<figure class="polaroid"><div class="map" id="${id}"></div><figcaption>где-то здесь ♡</figcaption></figure>`
    : `<div class="map-missing">Карта появится, когда будут заданы координаты.</div>`;
}

// Мини-карта без библиотек: плитки OpenStreetMap + круг поверх
function drawMap(id, key, z) {
  const el = document.getElementById(id);
  if (!el || el.dataset.done) return;
  el.dataset.done = "1";
  const [lat, lon] = shiftedCenter(key, z);
  const W = el.clientWidth, H = el.clientHeight;
  const cos = Math.cos(lat * Math.PI / 180);
  const zoom = Math.min(18, Math.round(Math.log2(156543.03 * cos / (z.r / 52))));
  const scale = 256 * Math.pow(2, zoom);
  const cx = (lon + 180) / 360 * scale;
  const s = Math.sin(lat * Math.PI / 180);
  const cy = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale;
  const left = cx - W / 2, top = cy - H / 2;
  let html = "";
  for (let tx = Math.floor(left / 256); tx <= Math.floor((left + W) / 256); tx++) {
    for (let ty = Math.floor(top / 256); ty <= Math.floor((top + H) / 256); ty++) {
      html += `<img alt="" src="https://tile.openstreetmap.org/${zoom}/${tx}/${ty}.png" style="left:${Math.round(tx * 256 - left)}px;top:${Math.round(ty * 256 - top)}px">`;
    }
  }
  const rpx = z.r / (156543.03 * cos / Math.pow(2, zoom));
  html += `<svg class="ring" width="${W}" height="${H}"><circle cx="${W / 2}" cy="${H / 2}" r="${rpx}" fill="#f4a7c0" fill-opacity=".35" stroke="#d33c5c" stroke-width="3" stroke-dasharray="7 6"/></svg>`;
  html += `<span class="osm">© OpenStreetMap</span>`;
  el.innerHTML = html;
}

function render() {
  const app = document.getElementById("app");
  const key = location.hash.replace("#", "").trim();
  const st = STAGES[key];

  if (!st) {
    app.innerHTML = `
      ${kiss("x", "tl")}
      <p class="strip">тссс</p>
      <h1 class="ransom">${ransom("Ещё рано", "x", 34)}</h1>
      <div class="card note tape tilt-l"><p>Этот квест начинается с конверта. Найди его - и отсканируй код оттуда.</p></div>`;
    return;
  }

  const idx = ORDER.indexOf(key);
  const hints = st.hints || [];
  const gated = Array.isArray(st.answers) && st.answers.length > 0;
  let solved = false;
  try { solved = localStorage.getItem("solved-" + key) === "1"; } catch (e) {}
  const hintsHtml = hints.map((h, i) => `
    <div class="hint" id="h${i}">
      <p>${esc(h.text)}</p>
      ${h.map ? mapHtml("map-h" + i, st.zone) : ""}
    </div>
    <button class="hint" id="b${i}">${i === 0 ? "подсказка ♡" : "ещё подсказка ♡"}</button>`).join("");

  app.innerHTML = `
    ${kiss(key + "a", "tl")}
    ${isDraft() ? '<div class="draft">Черновик: остались поля в [квадратных скобках] или пустые координаты.</div>' : ""}
    <div class="hearts">${hearts(idx)}</div>
    <p class="strip">${esc(st.strip)}</p>
    <h1 class="ransom">${ransom(st.title, key, 34)}</h1>
    ${st.dict ? `<div class="dict"><b>квест</b> <i>[квэ́ст] сущ.</i><br>Прогулка по нашему посёлку. Куда она приведёт, узнаешь сама.</div>` : ""}
    <div class="card note tape tilt-l">${kiss(key + "b", "tr")}<p>${esc(st.note)}</p></div>
    ${st.task ? `<div class="card tilt-r">
      <div class="label">${ransom("задание", key + "t", 15)}</div>
      <p class="riddle">${esc(st.task)}</p>
      ${gated ? `<input class="task-input" id="ans" inputmode="text" autocomplete="off" placeholder="ответ">
      <button class="btn" id="check">проверить ♡</button>
      <p class="task-msg" id="msg"></p>
      <button class="btn ghost hidden" id="skip">идти дальше без ответа</button>` : ""}
    </div>` : ""}
    ${gated && !solved ? `<p class="locked-note" id="lockednote">следующая загадка откроется после задания</p>` : ""}
    <div id="rest" class="${gated && !solved ? "hidden" : ""}">
    <div class="card torn tilt-l">
      <div class="label">${ransom("загадка", key + "l", 15)}</div>
      <p class="riddle">${esc(st.riddle)}</p>
      ${st.cipher ? `<div class="cipher">${ransom(st.cipher, key + "c", 26)}</div>` : ""}
      ${st.alphabet ? `<p class="alphabet">${ALPHABET.slice(0, 17)}<br>${ALPHABET.slice(17)}</p>` : ""}
      ${st.map ? mapHtml("map-main", st.zone) : ""}
      <p class="spot">${esc(st.spotLabel || "где искать")}: ${esc(st.spot)}</p>
    </div>
    ${hints.length ? `<div class="card hintbox tilt-r">${kiss(key + "c", "bl")}${hintsHtml}</div>` : ""}
    </div>
    <p class="call">${esc(PHONE_NOTE)}</p>`;

  const unlock = () => {
    document.getElementById("rest").classList.remove("hidden");
    document.getElementById("lockednote")?.remove();
    if (st.map && zoneReady(st.zone)) drawMap("map-main", key, st.zone);
  };
  if (!gated || solved) unlock();

  if (gated) {
    let tries = 0;
    const ok = st.answers.map(norm);
    const input = document.getElementById("ans"), msg = document.getElementById("msg");
    if (solved) { input.value = "✓"; input.disabled = true; msg.textContent = "Верно ♡"; }
    const check = () => {
      const v = norm(input.value);
      if (st.answerMode === "contains" ? ok.some(a => a && v.includes(a)) : ok.includes(v)) {
        msg.textContent = "Верно ♡";
        try { localStorage.setItem("solved-" + key, "1"); } catch (e) {}
        document.getElementById("skip").classList.add("hidden");
        unlock();
      } else {
        tries++;
        msg.textContent = tries < 3 ? (st.answerMode === "contains" ? "Не то. Попробуй сформулировать иначе." : "Не то. Посчитай ещё раз.") : "Не сходится? Позвони мне или иди дальше.";
        if (tries >= 3) document.getElementById("skip").classList.remove("hidden");
      }
    };
    document.getElementById("check").onclick = check;
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    document.getElementById("skip").onclick = () => { document.getElementById("skip").classList.add("hidden"); unlock(); };
  }

  document.getElementById("b0")?.classList.add("show");
  hints.forEach((h, i) => {
    document.getElementById("b" + i).onclick = () => {
      document.getElementById("b" + i).classList.remove("show");
      document.getElementById("h" + i).classList.add("show");
      document.getElementById("b" + (i + 1))?.classList.add("show");
      if (h.map && zoneReady(st.zone)) drawMap("map-h" + i, key, st.zone);
    };
  });
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
